# Codemagic CI/CD Configuration for Android (MiNegocio POS)
# Documentation: https://docs.codemagic.io/yaml-quick-start/building-a-native-android-app/

workflows:
  android-build:
    name: Android Build (Debug & Release)
    max_build_duration: 30
    instance_type: mac_mini_m2 # Supports macOS and Linux runners
    environment:
      vars:
        PACKAGE_NAME: "com.aistudio.minegocio.posapp"
      java: 21 # AGP 9.x+ requires Java 21

    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper

    triggering:
      events:
        - push
        - pull_request
        - tag
      branch_patterns:
        - pattern: '*'
          include: true
          source: true

    scripts:
      - name: Set up environment and local properties
        script: |
          echo "Setting up build environment..."
          echo "Java version in build agent:"
          java -version
          
          # Create .env if missing
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # Create a dummy google-services.json if missing to prevent build warnings
          if [ ! -f "app/google-services.json" ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "123456789",
              "project_id": "minegocio-pos-local",
              "storage_bucket": "minegocio-pos-local.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789:android:abcdef0123456789",
                  "android_client_info": {
                    "package_name": "com.aistudio.minegocio.posapp"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "dummy_api_key"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi
          
          # Ensure gradlew has executable permissions
          chmod +x gradlew

      - name: Set up debug keystore if missing
        script: |
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 --decode debug.keystore.base64 > debug.keystore
            else
              keytool -genkey -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build Android Debug APK
        script: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Android Release APK & App Bundle (AAB)
        script: |
          # Create release key if not configured in environment
          if [ ! -f "my-upload-key.jks" ] && [ -z "$KEYSTORE_PATH" ]; then
            echo "Generating release signing key for CI build..."
            keytool -genkey -v \
              -keystore my-upload-key.jks \
              -storepass "android" \
              -alias "upload" \
              -keypass "android" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=MiNegocio POS,O=Production,C=US"
            export STORE_PASSWORD="android"
            export KEY_PASSWORD="android"
          fi
          
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

    artifacts:
      - app/build/outputs/**/*.apk
      - app/build/outputs/**/*.aab
      - app/build/outputs/**/mapping.txt
